<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19181d" />
    <script>
      // Apply a saved choice before styles load, avoiding a flash of the wrong theme.
      try {
        if (localStorage.getItem("nudge-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content =
            "#f6f5f2";
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Owlert — your owl habit companion. Track your habits and receive reminders across all your devices."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Owlert — Your owl companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
