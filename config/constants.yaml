# Single source of truth for tunable numbers shared with server/constants.js.
# Edit values here rather than hardcoding them again elsewhere.

violations:
  # How long a violation event (Arduino already decided a habit was crossed,
  # e.g. slouched continuously past its own on-device threshold) is kept in
  # the violations table / counted in GET /api/violations, /api/state.
  windowHours: 48
