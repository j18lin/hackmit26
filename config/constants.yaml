# Single source of truth for tunable numbers shared across the Node backend
# (server/constants.js) and the Python CV scripts (cv/constants.py). Edit
# values here rather than hardcoding them again in either language.

sensors:
  # How far back /api/sensors/latest and /api/state look for readings.
  windowHours: 48
  # How long a boolean sensor field can stay continuously "on" before the
  # dashboard flags it as an alert (see server/domain.js evaluateSensorThresholds).
  thresholdMinutes:
    slouching: 15
    doomscrolling: 20
    sleeping: 30

posture:
  # Minimum MoveNet keypoint confidence to trust a joint's position.
  confThreshold: 0.3
  # EMA smoothing factor for keypoints: lower = smoother/laggier, higher = snappier/more jitter.
  smoothingAlpha: 0.4
  # abs(ear-midpoint x - shoulder-midpoint x) / shoulder width, above which we flag forward-head/leaning.
  forwardHeadThreshold: 0.35
